<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Treinamentos Policiais</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style type="text/tailwindcss">
@layer components{
.inp{@apply w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-400}
.b1{@apply px-3 py-2 rounded-lg text-sm font-medium bg-slate-800 text-white hover:bg-slate-700 disabled:opacity-40}
.b2{@apply px-3 py-2 rounded-lg text-sm font-medium bg-amber-500 text-slate-900 hover:bg-amber-400 disabled:opacity-40}
.b3{@apply px-3 py-2 rounded-lg text-sm font-medium border border-slate-300 bg-white text-slate-700 hover:bg-slate-50}
.bd{@apply px-3 py-2 rounded-lg text-sm font-medium border border-red-200 bg-white text-red-700 hover:bg-red-50}
.card{@apply bg-white rounded-xl border border-slate-200 shadow-sm p-5}
.lbl{@apply block text-xs font-semibold text-slate-600 mb-1}
}
@media print{#nav,#app,#toasts,.noprint{display:none!important}#modal>div{position:static!important;background:#fff!important;display:block!important;padding:0!important}#modal>div>div{max-width:none!important;max-height:none!important;box-shadow:none!important;overflow:visible!important;padding:0!important}}
body{background:#f1f5f9;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
</style></head>
<body>
<div id="nav"></div><main id="app" class="max-w-6xl mx-auto px-4 py-6" style="padding-bottom:calc(1.5rem + env(safe-area-inset-bottom,0px))"></main>
<div id="modal"></div><div id="toasts" class="fixed right-4 z-50 space-y-2" style="top:calc(4.5rem + env(safe-area-inset-top,0px))"></div>
<script>
const DEFAULT_FIREBASE_URL="https://controle-de-inscricoes-default-rtdb.firebaseio.com/"; 
const K='gt_v1',DPS=['1º DP','2º DP','3º DP','4º DP','5º DP','Delegacia da Mulher','DIG','DEIC','Plantão Central'];
const uid=()=>Math.random().toString(36).slice(2,9),$=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function newPin(){return String(1000+Math.floor(Math.random()*9000))}
function ensure(o){o.trainings=o.trainings||[];o.regs=o.regs||[];o.dps=o.dps||[...DPS];o.pins=o.pins||{};o.dps.forEach(d=>{if(!o.pins[d])o.pins[d]=newPin()})}
function seed(){const o=seed0();ensure(o);o.regs.forEach((r,i)=>{if(i%3!=2){r.present=true;r.checkInAt=new Date(2026,10,r.sid=='s3'?26:25,r.sid=='s2'?14:8,5+i*2).getTime()}});return o}
function seed0(){
  const mk=(sid,dp,names,p)=>names.map((n,i)=>({id:uid(),tid:'t1',sid,dp,resp:'Dr(a). '+dp,rrole:'Delegado(a)',at:Date.now(),data:{name:n,func:String(p*1000+i*7+101),tel:'(11) 9'+p+'00'+i+'-1'+p+'2'+i}}));
  return{dps:[...DPS],trainings:[{id:'t1',title:'Treinamento Operacional de Escrivães - Novo Sistema',desc:'Capacitação prática no novo sistema de registro. Levar documento funcional. Turmas mistas: respeite o limite por delegacia.',role:'Escrivão',status:'Aberto',
    slots:[{id:'s1',date:'2026-11-25',start:'08:00',end:'12:00',total:30,perDp:5},{id:'s2',date:'2026-11-25',start:'14:00',end:'18:00',total:30,perDp:5},{id:'s3',date:'2026-11-26',start:'08:00',end:'12:00',total:20,perDp:4}],
    fields:[{id:'func',label:'Funcional'},{id:'tel',label:'Telefone'}]}],
   regs:[...mk('s1','1º DP',['Ana Souza','Bruno Lima','Carla Dias','Diego Rocha','Elisa Martins'],1),...mk('s1','2º DP',['Fábio Alves','Gabriela Nunes','Hugo Pires'],2),
         ...mk('s2','Delegacia da Mulher',['Isabel Costa','Joana Prado','Karen Melo','Larissa Nogueira'],3),...mk('s2','1º DP',['Marcos Teixeira','Nelson Araújo'],1),...mk('s3','2º DP',['Otávio Brito','Paula Ramos'],2)]};
}
function load(){try{const r=localStorage.getItem(K);if(r){const o=JSON.parse(r);if(!o.dps)o.dps=[...DPS];ensure(o);return o}}catch(e){}return seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load(),U={view:'dp',auth:false,tab:'build',bt:null,base:'',ok:{},exo:{},c:{tid:'',sid:'',q:'',run:false,sel:null,via:''},f:{tid:'',sid:'',dp:'',q:''},d:{tid:'',sid:'',dp:'',resp:'',rrole:'',rows:[{}]},m:null};
const T=id=>S.trainings.find(t=>t.id==id),sl=(t,id)=>t&&t.slots.find(s=>s.id==id);
const used=(tid,sid,ex)=>S.regs.filter(r=>r.tid==tid&&r.sid==sid&&r.id!=ex).length;
const usedDp=(tid,sid,dp,ex)=>S.regs.filter(r=>r.tid==tid&&r.sid==sid&&r.dp==dp&&r.id!=ex).length;
const hh=t=>t.endsWith(':00')?t.slice(0,2)+'h':t.replace(':','h'),fd=d=>d?d.split('-').reverse().slice(0,2).join('/'):'--/--';
const lim=(s,dp)=>(s.ex&&dp&&s.ex[dp]!=null)?s.ex[dp]:s.perDp;
const nk=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
const fidF=t=>t&&t.fields.find(f=>/matr|funcional/i.test(f.label));
const fid=(t,d)=>{const f=fidF(t);return f?nk(d[f.id]):''};
const fv=(t,r)=>{const f=fidF(t);return f?r.data[f.id]||'':''};
const dupOf=(tid,data,ex)=>{const t=T(tid),a=fid(t,data),n=nk(data.name);return S.regs.find(r=>r.tid==tid&&r.id!=ex&&((a&&a==fid(t,r.data))||nk(r.data.name)==n))};
const hm=x=>new Date(x).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const scode=(tid,sid)=>{let h=0;for(const c of tid+sid+'k')h=(h*31+c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase().slice(0,5)};
const lab=s=>`${fd(s.date)} - ${hh(s.start)} às ${hh(s.end)}`;
function toast(m,err){const e=document.createElement('div');e.className='px-4 py-3 rounded-lg shadow-lg text-sm text-white '+(err?'bg-red-600':'bg-slate-800 border-l-4 border-amber-400');e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3000)}
function modal(h,w){$('#modal').innerHTML=`<div class="fixed inset-0 z-40 bg-slate-900/60 flex items-center justify-center p-4" onclick="if(event.target==this)closeM()"><div class="bg-white rounded-2xl shadow-2xl w-full ${w||'max-w-lg'} max-h-[90vh] overflow-y-auto p-6">${h}</div></div>`}
const closeM=()=>{$('#modal').innerHTML='';U.m=null};
let cf=null;function confirmBox(msg,fn){cf=fn;modal(`<p class="text-slate-800 mb-5">${msg}</p><div class="flex justify-end gap-2"><button class="b3" onclick="closeM()">Cancelar</button><button class="bd" onclick="const f=cf;closeM();f()">Confirmar</button></div>`)}
let pend=null;
const dirty=()=>{if(!U.bt)return false;const s=T(U.bt.id);return JSON.stringify(U.bt)!==(s?JSON.stringify(s):U.base)};
function dchk(){const e=$('#dirty');if(e)e.classList.toggle('hidden',!dirty())}
document.addEventListener('change',dchk);document.addEventListener('input',dchk);
function leave(fn){if(U.view=='admin'&&U.tab=='build'&&dirty()){pend=fn;modal(`<h3 class="text-lg font-semibold text-slate-900 mb-2">Alterações não salvas</h3><p class="text-sm text-slate-600 mb-5">Você tem alterações no construtor que ainda não foram salvas. Deseja salvar antes de sair?</p><div class="flex flex-wrap justify-end gap-2"><button class="b3" onclick="closeM();render()">Continuar editando</button><button class="bd" onclick="const f=pend;closeM();U.bt=null;f()">Descartar</button><button class="b2" onclick="const f=pend;closeM();saveT(f)">Salvar e sair</button></div>`)}else fn()}
function go(v){if(v==U.view)return;if(v=='admin'&&!U.auth){U.after=null;return pinModal()}leave(()=>{U.view=v;render()})}
function goTab(t){if(t==U.tab)return;leave(()=>{U.tab=t;render()})}
function pinModal(){modal(`<h3 class="text-lg font-semibold text-slate-900 mb-1">🔒 Acesso do Coordenador</h3><p class="text-sm text-slate-600 mb-3">Informe a senha para acessar o painel.</p><input id="pin" type="password" class="inp" placeholder="Digite a senha" onkeydown="if(event.key=='Enter')chkPin()"><div class="flex justify-end gap-2 mt-5"><button class="b3" onclick="closeM()">Cancelar</button><button class="b2" onclick="chkPin()">Entrar</button></div>`);setTimeout(()=>{const p=$('#pin');if(p)p.focus()},50)}
function chkPin(){if($('#pin').value=='231076'){U.auth=true;closeM();if(U.after){const f=U.after;U.after=null;render();f()}else{U.view='admin';render();toast('Acesso de coordenador liberado')}}else toast('PIN incorreto',1)}
function logout(){leave(()=>{U.auth=false;U.view='dp';U.bt=null;render();toast('Você saiu do modo Admin')})}
function render(){
  $('#nav').innerHTML=`<header class="bg-slate-900 text-white sticky top-0 z-30" style="padding-top:env(safe-area-inset-top,0px)"><div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3"><div class="flex items-center gap-2 mr-auto"><span class="text-amber-400 text-2xl">★</span><div><div class="font-semibold leading-tight">Gestão de Treinamentos</div><div class="text-xs text-slate-400">Alocação por Delegacias</div></div>${statusBtn()}</div>${(U.kiosk?[]:[['admin','Visão do Coordenador'],['dp','Visão da Delegacia'],['ci','Check-in / Presença (Aluno)']]).map(([v,l])=>`<button onclick="go('${v}')" class="px-4 py-2 rounded-lg text-sm font-medium ${U.view==v?'bg-amber-500 text-slate-900':'bg-slate-800 text-slate-200 hover:bg-slate-700'}">${l}</button>`).join('')}${U.auth?`<button onclick="logout()" class="px-3 py-2 rounded-lg text-sm font-medium border border-amber-500 text-amber-400 hover:bg-slate-800">🔒 Sair do modo Admin</button>`:''}</div></header>`;
  $('#app').innerHTML=U.view=='dp'?vDp():U.view=='ci'?vCi():`<div class="flex flex-wrap gap-2 mb-5 items-center">${[['build','1. Construtor de Treinamentos'],['panel','2. Painel e Dados']].map(([t,l])=>`<button onclick="goTab('${t}')" class="px-4 py-2 rounded-lg text-sm font-semibold border ${U.tab==t?'bg-white border-amber-400 text-slate-900 shadow-sm':'border-transparent text-slate-600 hover:bg-white'}">${l}</button>`).join('')}<button class="b3 ml-auto" onclick="confirmBox('Restaurar os dados de exemplo? Tudo o que foi criado será perdido (em todos os dispositivos conectados).',()=>{commit(()=>{const n=seed();S.trainings=n.trainings;S.regs=n.regs;S.dps=n.dps;S.pins=n.pins});U.ok={};U.bt=null;U.f={tid:'',sid:'',dp:'',q:''};U.d={tid:'',sid:'',dp:'',resp:'',rrole:'',rows:[{}]};render();toast('Dados de exemplo restaurados')})">Resetar Dados de Exemplo</button></div>`+(U.tab=='build'?vBuild():vPanel());
  if(U.view=='dp')updInfo();
}
/* ---------- Construtor ---------- */
const newT=()=>({id:uid(),title:'',desc:'',role:'Escrivão',status:'Aberto',slots:[{id:uid(),date:'',start:'08:00',end:'12:00',total:30,perDp:5}],fields:[{id:'func',label:'Funcional'}]});
function vBuild(){
  if(!U.bt){U.bt=S.trainings[0]?clone(S.trainings[0]):newT();U.base=JSON.stringify(U.bt)}
  const b=U.bt,isNew=!T(b.id);
  return`<div class="grid lg:grid-cols-3 gap-5"><div class="lg:col-span-2 space-y-5">
  <div class="card"><div class="flex flex-wrap gap-2 items-end mb-4"><div class="flex-1 min-w-[200px]"><label class="lbl">Treinamento em edição</label><select class="inp" onchange="pickT(this.value)">${S.trainings.map(t=>`<option value="${t.id}" ${t.id==b.id?'selected':''}>${esc(t.title)}</option>`).join('')}${isNew?`<option selected>(Novo treinamento)</option>`:''}<option value="new">+ Criar novo treinamento</option></select></div></div>
  <div class="grid sm:grid-cols-2 gap-3"><div class="sm:col-span-2"><label class="lbl">Título</label><input class="inp" value="${esc(b.title)}" onchange="U.bt.title=this.value"></div>
  <div class="sm:col-span-2"><label class="lbl">Descrição / instruções gerais</label><textarea rows="3" class="inp" onchange="U.bt.desc=this.value">${esc(b.desc)}</textarea></div>
  <div><label class="lbl">Cargo foco</label><select class="inp" onchange="U.bt.role=this.value">${['Escrivão','Investigador','Delegado','Agente de Telecomunicações','Geral'].map(o=>`<option ${o==b.role?'selected':''}>${o}</option>`).join('')}</select></div>
  <div><label class="lbl">Status</label><select class="inp" onchange="U.bt.status=this.value">${['Aberto','Encerrado'].map(o=>`<option ${o==b.status?'selected':''}>${o}</option>`).join('')}</select></div></div></div>
  <div class="card"><div class="flex items-center mb-3"><h3 class="font-semibold text-slate-800 mr-auto">Turmas / Horários</h3><button class="b2" onclick="U.bt.slots.push({id:uid(),date:'',start:'08:00',end:'12:00',total:30,perDp:5});render()">+ Adicionar turma</button></div>
  <div class="space-y-3">${b.slots.map((s,i)=>`<div class="border border-slate-200 rounded-lg p-3 bg-slate-50"><div class="grid grid-cols-2 sm:grid-cols-5 gap-2 items-end">
   <div class="col-span-2 sm:col-span-1"><label class="lbl">Data</label><input type="date" class="inp" value="${s.date}" onchange="U.bt.slots[${i}].date=this.value"></div>
   <div><label class="lbl">Início</label><input type="time" class="inp" value="${s.start}" onchange="U.bt.slots[${i}].start=this.value"></div>
   <div><label class="lbl">Fim</label><input type="time" class="inp" value="${s.end}" onchange="U.bt.slots[${i}].end=this.value"></div>
   <div><label class="lbl">Vagas totais</label><input type="number" min="1" class="inp" value="${s.total}" onchange="U.bt.slots[${i}].total=+this.value"></div>
   <div><label class="lbl">Máx. por delegacia</label><input type="number" min="1" class="inp" value="${s.perDp}" onchange="U.bt.slots[${i}].perDp=+this.value"></div></div>
   <div class="flex justify-between items-center mt-2"><button class="text-xs text-amber-800 hover:underline" onclick="U.exo['${s.id}']=!U.exo['${s.id}'];render()">Configurar exceções por DP (${Object.keys(s.ex||{}).length})</button><button class="text-xs text-red-700 hover:underline" onclick="if(U.bt.slots.length>1){U.bt.slots.splice(${i},1);render()}else toast('Mantenha ao menos uma turma',1)">Remover turma</button></div>${U.exo[s.id]?`<div class="mt-2 border-t border-slate-200 pt-2"><p class="text-xs text-slate-500 mb-2">Limite específico por delegacia nesta turma. Em branco = padrão (${s.perDp}).</p><div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${S.dps.map(d=>`<label class="text-xs text-slate-700">${esc(d)}<input type="number" min="0" class="inp !py-1 mt-1" placeholder="${s.perDp}" value="${s.ex&&s.ex[d]!=null?s.ex[d]:''}" data-d="${esc(d)}" onchange="setEx(${i},this.value,this.dataset.d)"></label>`).join('')}</div></div>`:''}</div>`).join('')}</div></div></div>
  <div class="space-y-5"><div class="card"><h3 class="font-semibold text-slate-800 mb-1">Campos dos participantes</h3><p class="text-xs text-slate-500 mb-3">"Nome Completo" é sempre obrigatório. Adicione campos extras:</p>
   <div class="flex items-center justify-between bg-slate-100 rounded-lg px-3 py-2 text-sm mb-2"><span>Nome Completo</span><span class="text-xs text-slate-500">padrão</span></div>
   ${b.fields.map((f,i)=>`<div class="flex items-center justify-between border border-slate-200 rounded-lg px-3 py-2 text-sm mb-2"><span>${esc(f.label)}</span><button class="text-red-700 text-xs hover:underline" onclick="U.bt.fields.splice(${i},1);render()">Remover</button></div>`).join('')}
   <div class="flex gap-2 mt-3"><input id="nf" class="inp" placeholder="Ex.: RG, E-mail, Observação" onkeydown="if(event.key=='Enter')addF()"><button class="b1" onclick="addF()">+</button></div>
   <div class="flex flex-wrap gap-1 mt-2">${['Matrícula','RG','WhatsApp','E-mail','Observação'].map(x=>`<button class="text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-900 hover:bg-amber-200" onclick="addF('${x}')">+ ${x}</button>`).join('')}</div></div>
   <div class="card"><h3 class="font-semibold text-slate-800 mb-1">Delegacias / Unidades Participantes</h3><p class="text-xs text-slate-500 mb-2">Lista oficial com o código de acesso de cada unidade (editável).</p><button class="b3 !py-1 text-xs mb-3" onclick="copyPins()">Copiar lista de códigos</button><div class="max-h-60 overflow-y-auto">${S.dps.map((d,i)=>{const n=S.regs.filter(r=>r.dp==d).length;return`<div class="flex items-center justify-between border border-slate-200 rounded-lg px-3 py-2 text-sm mb-2"><span>${esc(d)}${n?` <span class="text-xs text-slate-500">· ${n} inscrito(s)</span>`:''}</span><span class="flex items-center gap-2"><input class="inp !w-20 !py-1 text-center font-mono" title="Código de acesso" value="${esc(S.pins[d]||'')}" onchange="setPin(${i},this.value)"><button class="text-slate-500 text-xs" title="Gerar novo código" onclick="regPin(${i})">↻</button><button class="text-red-700 text-xs hover:underline" onclick="rmDp(${i})">Remover</button></span></div>`}).join('')}</div><div class="flex gap-2 mt-3"><input id="nd" class="inp" placeholder="Ex.: 6º DP" onkeydown="if(event.key=='Enter')addDp()"><button class="b1" onclick="addDp()">+</button></div></div>
   <div class="card flex flex-col gap-2"><div id="dirty" class="text-xs font-medium text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 ${dirty()?'':'hidden'}">● Há alterações não salvas</div><button class="b2" onclick="saveT()">Salvar treinamento</button>${isNew?'':`<button class="bd" onclick="confirmBox('Excluir este treinamento e todas as suas inscrições?',delT)">Excluir treinamento</button>`}</div></div></div>`;
}
function pickT(v){leave(()=>{U.bt=v=='new'?newT():clone(T(v));U.base=JSON.stringify(U.bt);render()})}
const norm=s=>s.trim().toLowerCase().replace(/\s+/g,' ');
function setEx(i,v,d){const s=U.bt.slots[i];s.ex=s.ex||{};if(v==='')delete s.ex[d];else s.ex[d]=Math.max(0,+v);if(!Object.keys(s.ex).length)delete s.ex}
function setPin(i,v){v=v.trim();if(!/^[A-Za-z0-9]{3,8}$/.test(v)){toast('O código deve ter de 3 a 8 letras/números',1);return render()}const dn=S.dps[i];commit(()=>{S.pins[dn]=v},()=>toast('Código atualizado'))}
function regPin(i){const dn=S.dps[i];commit(()=>{S.pins[dn]=newPin()},()=>{render();toast('Novo código gerado')})}
function copyTxt(t){const f=()=>modal(`<h3 class="font-semibold mb-2">Copie o texto abaixo</h3><textarea id="ct" rows="10" class="inp font-mono text-xs">${esc(t)}</textarea><div class="text-right mt-3"><button class="b3" onclick="closeM()">Fechar</button></div>`);try{navigator.clipboard.writeText(t).then(()=>toast('Copiado')).catch(f)}catch(e){f()}}
function copyPins(){copyTxt('Códigos de acesso das delegacias\n'+S.dps.map(d=>d+': '+S.pins[d]).join('\n'))}
function addDp(){const v=$('#nd').value.trim().replace(/\s+/g,' ');if(!v)return;if(S.dps.some(d=>norm(d)==norm(v)))return toast('Esta delegacia já está na lista',1);commit(()=>{if(S.dps.some(d=>norm(d)==norm(v)))return 'Esta delegacia já está na lista';S.dps.push(v);S.pins[v]=newPin()},()=>{render();toast('Delegacia adicionada')})}
function rmDp(i){const d=S.dps[i],n=S.regs.filter(r=>r.dp==d).length;if(n)return toast('Não é possível remover '+d+': há '+n+' inscrito(s) vinculados',1);commit(()=>{const n2=S.regs.filter(r=>r.dp==d).length;if(n2)return 'Não é possível remover '+d+': há '+n2+' inscrito(s)';delete S.pins[d];S.dps=S.dps.filter(x=>x!=d)},()=>{render();toast('Delegacia removida')})}
function addF(x){const el=$('#nf'),l=(x||el.value).trim();if(!l)return;if(U.bt.fields.some(f=>f.label.toLowerCase()==l.toLowerCase()))return toast('Campo já existe',1);U.bt.fields.push({id:'f'+uid(),label:l});render()}
function saveT(cb){const b=U.bt;if(!b.title.trim())return toast('Informe o título do treinamento',1);
  for(const s of b.slots){if(!s.date||!s.start||!s.end)return toast('Preencha data e horário de todas as turmas',1);if(s.total<1||s.perDp<1)return toast('Vagas devem ser maiores que zero',1)}
  const nb=clone(b);commit(()=>{const i=S.trainings.findIndex(t=>t.id==nb.id);if(i<0)S.trainings.push(nb);else S.trainings[i]=nb;S.regs=S.regs.filter(r=>r.tid!=nb.id||nb.slots.some(s=>s.id==r.sid))},()=>{U.bt=clone(nb);U.base=JSON.stringify(nb);render();toast('Treinamento salvo');cb&&cb()})}
  
function delT(){const id=U.bt.id;commit(()=>{S.trainings=S.trainings.filter(t=>t.id!=id);S.regs=S.regs.filter(r=>r.tid!=id)},()=>{U.bt=null;render();toast('Treinamento excluído')})}
/* ---------- Painel ---------- */

function parseCfg(t){t=(t||'').trim();if(!t)return null;if(/^https?:\/\//i.test(t))return{databaseURL:t.replace(/\/+$/,'')};const c={};t.replace(/["']?([A-Za-z]\w*)["']?\s*:\s*["'`]([^"'`]+)["'`]/g,(m,k,v)=>{c[k]=v;return m});if(!c.databaseURL&&c.projectId)c.databaseURL='https://'+c.projectId+'-default-rtdb.firebaseio.com';return c.databaseURL&&/^https:\/\//.test(c.databaseURL)?c:null}

function connectFb(cfg){disconnectFb();if(!cfg){soft();return}
 if(typeof firebase==='undefined'){toast('SDK do Firebase não carregou (sem internet?). Operando em modo local.',1);soft();return}
 try{FBCFG=cfg;fbApp=firebase.initializeApp(cfg,'gt'+Date.now());const rdb=fbApp.database();DB=rdb.ref('sistema_treinamento');

function applyRemote(v){if(!v||!v.json||v.v===curV)return false;try{const n=JSON.parse(v.json);ensure(n);S=n;curV=v.v;save();return true}catch(e){return false}}
function onRemote(snap){const v=snap.val();
 if(!v||!v.json){DB.transaction(cur=>(cur&&cur.json)?undefined:{json:JSON.stringify(seed()),v:1,at:Date.now()},()=>{},false);return}
 if(applyRemote(v))soft()}
function commit(fn,ok){
 const run=st=>{const keep=S;S=st;let e;try{e=fn()}catch(x){e='Erro: '+x.message}finally{S=keep}return e};
 if(!DB){const st=clone(S),e=run(st);if(e){toast(e,1);return}S=st;save();ok&&ok();return}
 if(!cloudOK){toast('Sem conexão com a nuvem. A alteração não foi salva; tente novamente quando a conexão voltar.',1);return}
 let err=null;
 DB.transaction(cur=>{err=null;const st=cur&&cur.json?JSON.parse(cur.json):clone(S);ensure(st);err=run(st);if(err)return;return{json:JSON.stringify(st),v:((cur&&cur.v)||0)+1,at:Date.now()}},
  (e,committed,snap)=>{if(e){toast('Falha ao gravar na nuvem: '+e.message,1);return}if(!committed){toast(err||'Operação cancelada. Tente novamente.',1);return}applyRemote(snap.val());ok&&ok()},false)}

 let st=null;const sel='input,textarea';
 if(a&&box.contains(a)&&/^(INPUT|TEXTAREA)$/.test(a.tagName)){st={i:[...box.querySelectorAll(sel)].indexOf(a),v:a.value,s:a.selectionStart,e:a.selectionEnd,ph:a.placeholder,id:a.id,t:a.type}}

function ciRun(){U.c.q=$('#ciq').value;U.c.sel=null;U.c.run=true;render()}
function ciResult(t,s,r){const own=sl(t,r.sid);
 if(r.present&&r.sid!=s.id)return box('red','Acesso Negado','Você já realizou este treinamento na turma '+lab(own)+'. Cada servidor só pode participar uma única vez.');
 if(r.present)return box('green','Presença já confirmada',esc(r.data.name)+', sua presença nesta turma foi registrada às '+hm(r.checkInAt)+'.');
 if(r.sid!=s.id){const ok=used(t.id,s.id,r.id)<s.total&&usedDp(t.id,s.id,r.dp,r.id)<lim(s,r.dp);return `<div>${box('amber','Inscrição em outro horário','Sua inscrição original é da turma '+lab(own)+', e não desta. '+(ok?'Há vaga nesta turma: você pode trocar para ela e confirmar sua presença.':'Não há vaga disponível para você nesta turma. Procure a coordenação.'))}${ok?`<button class="b2 w-full mt-3 py-3" onclick="ciConfirm(true)">Trocar para esta turma e confirmar presença</button>`:''}</div>`}
 return `<div class="card"><div class="text-xs font-semibold text-green-700 mb-2">✔ Cadastro encontrado</div><div class="text-sm mb-3"><b>${esc(r.data.name)}</b> · ${esc(r.dp)}</div><div class="grid sm:grid-cols-2 gap-2">${t.fields.map(f=>`<div><label class="lbl">${esc(f.label)}</label><input id="ci_${f.id}" class="inp" value="${esc(r.data[f.id]||'')}"></div>`).join('')}</div><button class="b2 w-full mt-4 py-3" onclick="ciConfirm(false)">Confirmar Minha Presença</button></div>`}
function ciConfirm(swap){const r0=S.regs.find(x=>x.id==U.c.sel);if(!r0)return;const t0=T(r0.tid),vals={};t0.fields.forEach(f=>{const e=$('#ci_'+f.id);if(e)vals[f.id]=e.value.trim()});const rid=r0.id,sid2=U.c.sid;commit(()=>{const r=S.regs.find(x=>x.id==rid);if(!r)return 'Cadastro não encontrado';const t=T(r.tid),s=sl(t,sid2);if(!s)return 'Turma não encontrada';if(r.present&&r.sid!=sid2)return 'Acesso Negado: você já realizou este treinamento na turma '+lab(sl(t,r.sid))+'.';
 if(swap&&r.sid!=sid2){if(used(t.id,s.id,r.id)>=s.total||usedDp(t.id,s.id,r.dp,r.id)>=lim(s,r.dp))return 'Sem vaga disponível nesta turma';r.sid=s.id}
 Object.assign(r.data,vals);if(!r.present){r.present=true;r.checkInAt=Date.now()}},()=>{render();toast('Presença confirmada!')})}
function vCi(){const c=U.c,t=T(c.tid),s=sl(t,c.sid);let res='';
 if(t&&s&&c.run){const q=nk(c.q),cand=q?S.regs.filter(r=>r.tid==t.id&&(fid(t,r.data)==q||nk(r.data.name).includes(q))):[];
  if(!q)res=box('amber','Informe seus dados','Digite sua funcional/matrícula ou seu nome para buscar o cadastro.');
  else if(!cand.length)res=box('red','Cadastro não encontrado','Não localizamos você neste treinamento. Procure o responsável pela sua delegacia.');
  else{const r=c.sel?cand.find(x=>x.id==c.sel):cand.length==1?cand[0]:null;
   if(!r)res=`<div class="card"><p class="text-sm mb-2">Encontramos mais de um cadastro. Selecione o seu:</p>${cand.map(x=>`<button class="b3 w-full text-left mb-2" onclick="U.c.sel='${x.id}';render()">${esc(x.data.name)} · ${esc(x.dp)}</button>`).join('')}</div>`;else{c.sel=r.id;res=ciResult(t,s,r)}}}
 return `<div class="max-w-xl mx-auto space-y-5"><div class="card"><h2 class="font-semibold text-lg text-slate-900 mb-1">Check-in de presença</h2>${c.via?`<p class="text-xs text-green-700 mb-3">✔ Sessão validada pelo QR Code (código ${esc(c.via)})</p>`:'<p class="text-xs text-slate-500 mb-3">Selecione o treinamento e a turma de hoje.</p>'}<label class="lbl">Treinamento</label><select class="inp mb-2" onchange="U.c={tid:this.value,sid:'',q:'',run:false,sel:null,via:''};render()"><option value="">Selecione...</option>${S.trainings.map(x=>`<option value="${x.id}" ${x.id==c.tid?'selected':''}>${esc(x.title)}</option>`).join('')}</select>${t?`<label class="lbl">Turma / Horário</label><select class="inp mb-2" onchange="U.c.sid=this.value;U.c.run=false;U.c.sel=null;U.c.via='';render()"><option value="">Selecione...</option>${t.slots.map(x=>`<option value="${x.id}" ${x.id==c.sid?'selected':''}>${lab(x)}</option>`).join('')}</select>`:''}${s?`<label class="lbl">Funcional/Matrícula ou Nome</label><div class="flex gap-2"><input id="ciq" class="inp" oninput="U.c.q=this.value" value="${esc(c.q)}" onkeydown="if(event.key=='Enter')ciRun()"><button class="b1" onclick="ciRun()">Buscar</button></div>`:''}</div>${res}</div>`}
function updInfo(){const a=allowed(),el=$('#info');if(!el)return;el.innerHTML=a?`<b>Vagas totais restantes: ${a.rt}</b> | Limite disponível para sua delegacia neste horário: <b>${U.d.dp?Math.max(0,a.rd):a.s.perDp+' (informe a delegacia)'}</b>`:'Selecione um horário para ver as vagas.';const b=$('#addb');if(b)b.disabled=!a||U.d.rows.length>=a.max}
function vDp(){
  const d=U.d,open=S.trainings.filter(t=>t.status=='Aberto'),t=U.ok[d.dp]?T(d.tid):undefined,a=U.ok[d.dp]?allowed():null,blocked=a&&a.max<=0,mine=d.dp&&t?S.regs.filter(r=>r.tid==t.id&&r.dp==d.dp):[],
  summary=d.dp&&t?`<div class="card"><h2 class="font-semibold text-lg text-slate-900">Servidores já inscritos pela sua unidade neste treinamento</h2><p class="text-xs text-slate-500 mb-3">${esc(d.dp)} · ${mine.length} servidor(es) inscrito(s)</p>${mine.length?t.slots.map(s=>{const l=mine.filter(r=>r.sid==s.id);return l.length?`<div class="mb-3"><div class="text-sm font-medium text-slate-800 mb-1">${lab(s)} <span class="text-xs text-slate-500">· ${l.length}/${lim(s,d.dp)}</span></div><div class="space-y-1">${l.map(r=>`<div class="text-sm border border-slate-200 rounded-lg px-3 py-2 bg-slate-50"><b>${esc(r.data.name)}</b> <span class="text-xs text-slate-500">${t.fields.map(f=>esc(f.label)+': '+esc(r.data[f.id]||'-')).join(' · ')}</span></div>`).join('')}</div></div>`:''}).join(''):'<p class="text-sm text-slate-400">Nenhum servidor inscrito ainda por esta unidade.</p>'}</div>`:'';
  if(!open.length)return`<div class="card text-center text-slate-600">Não há treinamentos com inscrições abertas no momento.</div>`;
  return`<div class="max-w-3xl mx-auto space-y-5"><div class="card"><h2 class="font-semibold text-lg text-slate-900 mb-3">1. Identificação da unidade</h2><div class="grid sm:grid-cols-3 gap-3">
  <div><label class="lbl">Delegacia / Unidade</label><select class="inp" onchange="U.d.dp=this.value;U.d.rows=[{}];render()"><option value="">Selecione...</option>${S.dps.map(x=>`<option ${x==d.dp?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
  <div><label class="lbl">Nome do responsável</label><input class="inp" value="${esc(d.resp)}" oninput="U.d.resp=this.value"></div>
  <div><label class="lbl">Cargo</label><input class="inp" value="${esc(d.rrole)}" oninput="U.d.rrole=this.value"></div></div></div>
  ${d.dp&&!U.ok[d.dp]?`<div class="card"><h2 class="font-semibold text-lg text-slate-900 mb-1">Código de acesso da delegacia</h2><p class="text-xs text-slate-500 mb-3">Informe o código de ${esc(d.dp)} para liberar o formulário e a lista de inscritos.</p><div class="flex gap-2"><input id="dpin" class="inp max-w-[180px]" placeholder="Código" onkeydown="if(event.key=='Enter')chkDp()"><button class="b2" onclick="chkDp()">Liberar</button></div></div>`:''}${U.ok[d.dp]?`<div class="card"><h2 class="font-semibold text-lg text-slate-900 mb-3">2. Treinamento e horário</h2>
  <select class="inp mb-2" onchange="U.d.tid=this.value;U.d.sid='';U.d.rows=[{}];render()"><option value="">Selecione o treinamento...</option>${open.map(x=>`<option value="${x.id}" ${x.id==d.tid?'selected':''}>${esc(x.title)}</option>`).join('')}</select>
  ${t?`<p class="text-sm text-slate-600 mb-3">${esc(t.desc)} <span class="inline-block ml-1 text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-900">Foco: ${esc(t.role)}</span></p>
  <div class="grid sm:grid-cols-2 gap-2 mb-3">${t.slots.map(s=>{const r=s.total-used(t.id,s.id),ud=usedDp(t.id,s.id,d.dp);return`<button ${r<=0?'disabled':''} onclick="U.d.sid='${s.id}';U.d.rows=[{}];render()" class="text-left border rounded-lg p-3 ${s.id==d.sid?'border-amber-500 bg-amber-50 ring-2 ring-amber-300':'border-slate-200 hover:bg-slate-50'} ${r<=0?'opacity-40':''}"><div class="font-medium text-slate-900">${lab(s)}</div><div class="text-xs text-slate-500">${r<=0?'Turma lotada':r+' vagas · máx. '+lim(s,d.dp)+' por delegacia'}</div>${d.dp?`<div class="text-xs font-semibold mt-1 ${ud>=lim(s,d.dp)?'text-red-600':'text-amber-700'}">Sua delegacia: ${ud}/${lim(s,d.dp)} preenchidas</div>`:''}</button>`}).join('')}</div>
  <div id="info" class="text-sm bg-slate-900 text-slate-100 rounded-lg px-4 py-3"></div>`:''}</div>`:''}
  ${t&&d.sid&&blocked?`<div class="card border-amber-300 bg-amber-50"><h2 class="font-semibold text-amber-900 mb-1">Inscrições indisponíveis neste horário</h2><p class="text-sm text-amber-900">${a.rt<=0?'Esta turma/horário está lotada.':`Sua delegacia já preencheu todas as ${lim(a.s,d.dp)} vagas permitidas para esta turma/horário.`} Selecione outro horário acima ou consulte a lista de servidores já inscritos abaixo.</p></div>`:''}${t&&d.sid&&!blocked?`<div class="card"><div class="flex items-center mb-3"><h2 class="font-semibold text-lg text-slate-900 mr-auto">3. Servidores indicados</h2><button id="addb" class="b1" onclick="U.d.rows.push({});render()">+ Adicionar Servidor</button></div>
  <div class="space-y-3">${d.rows.map((r,i)=>`<div class="border border-slate-200 rounded-lg p-3 bg-slate-50"><div class="flex justify-between mb-2"><span class="text-xs font-semibold text-slate-500">SERVIDOR ${i+1}</span>${d.rows.length>1?`<button class="text-xs text-red-700 hover:underline" onclick="U.d.rows.splice(${i},1);render()">Remover</button>`:''}</div>
   <div class="grid sm:grid-cols-2 gap-2"><div class="sm:col-span-2"><label class="lbl">Nome Completo *</label><input class="inp" value="${esc(r.name)}" oninput="U.d.rows[${i}].name=this.value"></div>${t.fields.map(f=>`<div><label class="lbl">${esc(f.label)}</label><input class="inp" value="${esc(r[f.id])}" oninput="U.d.rows[${i}]['${f.id}']=this.value"></div>`).join('')}</div></div>`).join('')}</div>
  <button class="b2 w-full mt-4 py-3" onclick="sendDp()">Enviar inscrições</button></div>`:''}${summary}</div>`;
}
function sendDp(){const d=U.d,a=allowed();if(!d.dp.trim()||!d.resp.trim())return toast('Informe a delegacia e o responsável',1);
 if(d.rows.some(r=>!(r.name||'').trim()))return toast('Preencha o nome de todos os servidores',1);
 for(let i=0;i<d.rows.length;i++){const r=d.rows[i],tt=T(d.tid),ex=dupOf(d.tid,r);if(ex)return toast(r.name.trim()+' já está inscrito(a) neste treinamento na turma '+lab(sl(tt,ex.sid)),1);if(d.rows.some((o,k)=>k<i&&(nk(o.name)==nk(r.name)||(fid(tt,o)&&fid(tt,o)==fid(tt,r)))))return toast(r.name.trim()+' está duplicado(a) neste lote de envio',1)}
 if(d.rows.length>a.rd)return toast('Cota da delegacia excedida: máximo de '+Math.max(0,a.rd)+' neste horário',1);if(d.rows.length>a.rt)return toast('A turma não tem vagas suficientes ('+a.rt+' restantes)',1);
 const snap=clone(d),cnt=d.rows.length;commit(()=>{const e=chkSend(snap);if(e)return e;snap.rows.forEach(r=>S.regs.push({id:uid(),tid:snap.tid,sid:snap.sid,dp:snap.dp.trim(),resp:snap.resp.trim(),rrole:snap.rrole.trim(),at:Date.now(),data:{...r,name:r.name.trim()}}))},()=>{U.d.rows=[{}];render();toast(cnt+' servidor(es) inscrito(s) com sucesso')})}
 
render();
(function init(){
 try{const p=new URLSearchParams(location.search);if(p.get('view')=='checkin'){const tid=p.get('tid')||'',sid=p.get('sid')||'',k=p.get('k')||'';U.view='ci';U.kiosk=true;U.c={tid,sid,q:'',run:false,sel:null,via:k&&k==scode(tid,sid)?k:''}}}catch(e){}
 let cfg=null;try{const r=localStorage.getItem('gt_fb');if(r)cfg=JSON.parse(r)}catch(e){}
 if(!cfg&&DEFAULT_FIREBASE_URL)cfg=parseCfg(DEFAULT_FIREBASE_URL);
 render();if(cfg)connectFb(cfg);
})();
</script></body></html>
